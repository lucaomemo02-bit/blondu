<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0d17">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Blondu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Source+Serif+4:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: rail de servidores + lista de canais + chat + painel direito, painéis flutuantes sobre um fundo de papel de parede; no celular vira chat em tela cheia com gavetas. */
:root{
  --bg0:#0f0d17;--bg1:#151322;--bg2:#1b1829;--bg3:#25223a;--bg4:#312e4d;
  --fg:#eceaf8;--fg2:#aaa6c6;--fg3:#77738f;
  --line:rgba(255,255,255,.09);--hover:rgba(255,255,255,.06);--hover2:rgba(255,255,255,.11);
  --accent:#f2b441;--accent-fg:#241a05;--accent-text:color-mix(in srgb,var(--accent) 65%,#fff);
  --danger:#ff6b7a;--ok:#3fd6a2;--warn:#ffb454;
  --shadow:0 18px 40px -18px rgba(0,0,0,.6);
  --alpha:58;--a:calc(var(--alpha)*1%);--blur:28px;--sat:160%;--pr:18px;--gap:10px;
  --fs:15px;--font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--disp:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --w1:#f2b441;--w2:#8b7bff;--w3:#3fd6a2;--wop:.55;
  --av:40px;--ease:cubic-bezier(.2,.9,.3,1.15);
  color-scheme:dark;
}
:root[data-mode="light"]{
  --bg0:#e4e0f2;--bg1:#efecf9;--bg2:#faf9fe;--bg3:#ffffff;--bg4:#e6e2f3;
  --fg:#1c1930;--fg2:#56526e;--fg3:#8a86a2;
  --line:rgba(30,20,80,.11);--hover:rgba(40,30,100,.06);--hover2:rgba(40,30,100,.1);
  --accent-text:color-mix(in srgb,var(--accent) 55%,#000);
  --shadow:0 18px 40px -20px rgba(50,30,120,.35);--wop:.42;
  color-scheme:light;
}
:root[data-mode="amoled"]{
  --bg0:#000;--bg1:#07060b;--bg2:#000;--bg3:#15131f;--bg4:#211f30;
  --line:rgba(255,255,255,.1);color-scheme:dark;
}
:root[data-contrast="1"]{--fg2:color-mix(in srgb,var(--fg) 82%,transparent);--fg3:color-mix(in srgb,var(--fg) 62%,transparent);--line:color-mix(in srgb,var(--fg) 28%,transparent)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg0);color:var(--fg);font:400 var(--fs)/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:root[data-ul="1"] a{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--bg4) transparent}
.ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.2em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mut{color:var(--fg2)}.faint{color:var(--fg3)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== fundo ===== */
#wall{position:fixed;inset:0;z-index:0;background:var(--bg0) center/cover no-repeat;overflow:hidden}
#wall i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:var(--wop);will-change:transform}
#wall i:nth-child(1){background:var(--w1);left:-18vmax;top:-22vmax;animation:drift1 26s ease-in-out infinite alternate}
#wall i:nth-child(2){background:var(--w2);right:-24vmax;top:10vmax;animation:drift2 32s ease-in-out infinite alternate}
#wall i:nth-child(3){background:var(--w3);left:18vmax;bottom:-34vmax;animation:drift3 38s ease-in-out infinite alternate}
:root[data-photo="1"] #wall i{display:none}
:root[data-bganim="0"] #wall i{animation:none}
@keyframes drift1{to{transform:translate(14vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-12vmax,12vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(10vmax,-12vmax) scale(1.2)}}

/* ===== superfícies ===== */
.glass{position:relative;background:color-mix(in srgb,var(--sf,var(--bg1)) var(--a),transparent)}
:root[data-blur="1"] .glass,:root[data-blur="1"] .gl2{-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));backdrop-filter:blur(var(--blur)) saturate(var(--sat))}
:root[data-shadow="1"] .glass{box-shadow:var(--shadow)}
:root[data-spec="1"] .glass{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.07),inset 0 -26px 40px -34px rgba(255,255,255,.1),var(--shadow)}
:root[data-spec="1"][data-mode="light"] .glass{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.5),var(--shadow)}
:root[data-spec="1"] .glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:50;background:radial-gradient(460px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.1),transparent 46%);background-attachment:fixed}
:root[data-spec="0"][data-shadow="0"] .glass{box-shadow:none}

/* ===== controles ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 16px;border-radius:10px;border:1px solid transparent;background:var(--bg4);color:var(--fg);font-weight:600;transition:background .15s,transform .12s,filter .15s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{min-height:30px;padding:4px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--fg2);transition:background .15s,color .15s,transform .12s;flex:none;padding:0}
.ib:hover{background:var(--hover2);color:var(--fg)}.ib:active{transform:scale(.92)}
.ib.on{color:var(--accent-text);background:var(--hover)}.ib.bad{color:var(--danger)}
.in{width:100%;min-height:40px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg3) 80%,transparent);color:var(--fg);outline:0;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
textarea.in{resize:vertical;min-height:80px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg2) 50%),linear-gradient(135deg,var(--fg2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--fg2);margin:0 0 6px}
.fld{margin-bottom:14px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:4px 0 0}
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:13px;background:var(--bg4);transition:background .2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw input:checked+i{background:var(--accent)}.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--bg4) var(--p,50%));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
.seg{display:flex;gap:4px;padding:4px;background:var(--bg3);border-radius:12px;flex-wrap:wrap}
.seg button{flex:1;min-width:max-content;border:0;background:transparent;border-radius:9px;padding:7px 12px;color:var(--fg2);font-weight:600;transition:background .2s,color .2s}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--accent);color:var(--accent-fg);vertical-align:2px;margin-left:6px}
.bd{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center}

/* ===== avatar ===== */
.av{display:inline-block;vertical-align:middle;position:relative;width:var(--s,40px);height:var(--s,40px);flex:none;font-size:calc(var(--s,40px)*.52);line-height:1}
.av .in2{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--c,#888);color:#fff;font-weight:800}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:calc(var(--s,40px)*.34);height:calc(var(--s,40px)*.34);min-width:10px;min-height:10px;border-radius:50%;border:3px solid var(--dotbg,var(--bg1));background:var(--ok)}
.av .dot.idle{background:var(--warn)}.av .dot.dnd{background:var(--danger)}.av .dot.off{background:var(--fg3)}
.av.speak::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--ok);animation:speak 1s ease-out infinite}
@keyframes speak{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.2);opacity:0}}

/* ===== login ===== */
#login{position:fixed;inset:0;z-index:5;overflow:auto;display:grid;place-items:center;padding:24px 16px}
.lg{width:min(1060px,100%);display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,5vw,72px);align-items:center}
.lg-hero h1{font:800 clamp(56px,9vw,108px)/.9 var(--disp);letter-spacing:-.04em;margin:18px 0 18px;background:linear-gradient(100deg,var(--fg) 20%,var(--accent) 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-hero p{font-size:clamp(16px,2vw,20px);color:var(--fg2);max-width:30ch;margin:0 0 26px;text-wrap:balance}
.lg-feat{display:grid;gap:12px;margin:0;padding:0;list-style:none;max-width:380px}
.lg-feat li{display:flex;gap:12px;align-items:center;color:var(--fg2)}
.lg-feat .ic{color:var(--accent-text);width:22px;height:22px}
.logo{width:68px;height:68px;filter:drop-shadow(0 10px 22px color-mix(in srgb,var(--accent) 55%,transparent))}
.lg-card{padding:28px;border-radius:calc(var(--pr) + 8px);--sf:var(--bg1)}
.lg-card h2{font:700 24px/1.2 var(--disp);margin:0 0 4px}
.lg-tabs{display:flex;gap:4px;margin:18px 0 20px;padding:4px;background:var(--bg3);border-radius:12px}
.lg-tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;color:var(--fg2);transition:background .25s,color .25s}
.lg-tabs button.on{background:var(--accent);color:var(--accent-fg)}
.lg-style{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px;align-items:center;font-size:13px;color:var(--fg2)}
.lg-style button{border:1px solid var(--line);background:transparent;border-radius:20px;padding:4px 12px;color:var(--fg2);font-size:13px}
.lg-style button.on{background:var(--hover2);color:var(--fg);border-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg2);margin:4px 0 14px}
.chk input{accent-color:var(--accent);width:18px;height:18px}
.or{display:flex;align-items:center;gap:12px;color:var(--fg3);font-size:13px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* ===== app ===== */
#app{position:relative;z-index:1;height:100%;display:flex;gap:var(--gap);padding:var(--gap) 16px}
:root[data-float="0"] #app{gap:0;padding:0}
:root[data-float="0"] .glass{border-radius:0!important}
#nav{display:flex;gap:var(--gap);flex:none;min-height:0}
:root[data-float="0"] #nav{gap:0}
#rail{width:74px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;overflow-y:auto;overflow-x:hidden;--sf:var(--bg0);--dotbg:var(--bg0);border-radius:var(--pr);scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
#side{width:248px;display:flex;flex-direction:column;min-height:0;--sf:var(--bg1);border-radius:var(--pr);overflow:hidden}
#main{flex:1;min-width:0;display:flex;flex-direction:column;--sf:var(--bg2);--dotbg:var(--bg2);border-radius:var(--pr);overflow:hidden}
#panel{width:250px;flex:none;display:none;flex-direction:column;min-height:0;--sf:var(--bg1);border-radius:var(--pr);overflow:hidden}
#panel.show{display:flex}
#scrim{display:none}
.srv{position:relative;width:48px;height:48px;border:0;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--bg3);color:var(--fg);font-size:22px;flex:none;transition:border-radius .28s var(--ease),background .2s,transform .15s;background-size:cover;background-position:center}
.srv:hover{border-radius:16px}.srv:active{transform:scale(.94)}
.srv.on{border-radius:16px;background-color:var(--accent);color:var(--accent-fg)}
.srv .pill{position:absolute;left:-13px;top:50%;width:4px;height:8px;border-radius:0 4px 4px 0;background:var(--fg);transform:translateY(-50%);transition:height .25s var(--ease),opacity .2s;opacity:0}
.srv.on .pill{height:32px;opacity:1}.srv.un .pill{opacity:1}.srv:hover .pill{height:18px;opacity:1}.srv.on:hover .pill{height:32px}
.srv .bd{position:absolute;right:-5px;bottom:-5px;outline:3px solid var(--bg0)}
.srv.home{background:var(--bg3)}
.srv.add{background:transparent;border:1.5px dashed var(--fg3);color:var(--ok)}
.srv.add:hover{background:var(--ok);color:#06241a;border-color:var(--ok)}
.rsep{width:30px;height:2px;border-radius:1px;background:var(--line);flex:none}
.sh{display:flex;align-items:center;gap:8px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;font:700 16px var(--disp);width:100%;text-align:left;flex:none;color:var(--fg)}
.sh:hover{background:var(--hover)}
.sscroll{flex:1;overflow-y:auto;padding:8px 8px 12px;min-height:0}
.cat{display:flex;align-items:center;gap:4px;padding:14px 6px 4px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--fg3);text-transform:uppercase;cursor:pointer;user-select:none}
.cat:hover{color:var(--fg2)}.cat .ic{width:12px;height:12px;transition:transform .2s}.cat.col .ic{transform:rotate(-90deg)}
.cat .ib{width:22px;height:22px;margin-left:auto;opacity:0}.cat:hover .ib{opacity:1}
.ch{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;color:var(--fg3);cursor:pointer;font-weight:500;transition:background .15s,color .15s;position:relative;user-select:none}
.ch .ic{width:19px;height:19px}
.ch:hover{background:var(--hover);color:var(--fg2)}
.ch.on{background:var(--hover2);color:var(--fg)}
.ch.un{color:var(--fg);font-weight:700}
.ch.mu{opacity:.55}
.ch .bd{margin-left:auto}
.vp{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 34px;font-size:14px;color:var(--fg2)}
.sbottom{flex:none;border-top:1px solid var(--line)}
.vstat{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.vstat b{color:var(--ok);display:block;font-size:13px}
.upan{display:flex;align-items:center;gap:6px;padding:10px 8px 10px 10px}
.upan .me{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border:0;background:transparent;padding:4px;border-radius:10px;text-align:left}
.upan .me:hover{background:var(--hover)}
.upan .ib{width:32px;height:32px}
.upan b{display:block;font-size:14px;line-height:1.15}.upan small{display:block;color:var(--fg2);font-size:12px;line-height:1.2}
.dmi{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;color:var(--fg2);cursor:pointer;font-weight:500}
.dmi:hover{background:var(--hover);color:var(--fg)}.dmi.on{background:var(--hover2);color:var(--fg)}
.dmi .bd{margin-left:auto}
.dmi small{display:block;color:var(--fg3);font-size:12px;font-weight:400}

/* ===== chat ===== */
.hd{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 12px 6px 16px;border-bottom:1px solid var(--line);flex:none}
.hd h3{margin:0;font:700 16px var(--disp);display:flex;align-items:center;gap:8px;min-width:0}
.hd .topic{color:var(--fg3);font-size:13px;border-left:1px solid var(--line);padding-left:12px;margin-left:4px;min-width:0}
.hd .menu-b{display:none}
.hsearch{position:relative;display:flex;align-items:center}
.hsearch input{width:150px;height:32px;min-height:0;padding:4px 10px 4px 30px;border-radius:8px;transition:width .3s var(--ease)}
.hsearch input:focus{width:220px}
.hsearch .ic{position:absolute;left:9px;width:16px;height:16px;color:var(--fg3);pointer-events:none}
#notice{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:14px;flex:none}
#notice.warn{background:var(--warn);color:#2a1800}
#notice a{color:inherit;text-decoration:underline;white-space:nowrap}
#notice .ib{color:inherit;width:28px;height:28px}
#notice[hidden]{display:none}
#msgs{flex:1;overflow-y:auto;padding:8px 0 12px;min-height:0;overscroll-behavior:contain}
.intro{padding:24px 20px 8px}
.intro .big{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--bg4);font-size:32px;margin-bottom:10px}
.intro h2{font:800 28px/1.1 var(--disp);margin:0 0 6px;letter-spacing:-.02em}
.dday{display:flex;align-items:center;gap:12px;margin:16px 20px 4px;color:var(--fg3);font-size:12px;font-weight:700}
.dday::before,.dday::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{position:relative;display:grid;grid-template-columns:var(--av) 1fr;column-gap:14px;padding:2px 16px;margin:0 6px;border-radius:10px}
.msg:hover{background:var(--hover)}
.msg.first{margin-top:14px;padding-top:4px}
.msg .av{--s:var(--av);margin-top:2px;cursor:pointer}
.msg .gut{font-size:11px;color:var(--fg3);text-align:right;padding-top:5px;opacity:0;user-select:none}
.msg:hover .gut{opacity:1}
.msg .mh{display:flex;align-items:baseline;gap:8px;line-height:1.3}
.msg .nm{font-weight:700;cursor:pointer;color:color-mix(in srgb,var(--rc,var(--fg)) 78%,var(--fg))}.msg .nm:hover{text-decoration:underline}
.msg time{font-size:12px;color:var(--fg3)}
.mt{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.mt.big{font-size:2.3em;line-height:1.15}
.mt code{font:13px/1.4 'JetBrains Mono',ui-monospace,monospace;background:var(--bg0);padding:1px 5px;border-radius:5px}
.mt pre{margin:6px 0;padding:10px 12px;border-radius:10px;background:var(--bg0);font:13px/1.5 'JetBrains Mono',ui-monospace,monospace;overflow-x:auto;white-space:pre;border:1px solid var(--line)}
.mt .bq{display:block;border-left:4px solid var(--accent);padding-left:10px;color:var(--fg2)}
.mt .sp{background:var(--fg3);color:transparent;border-radius:4px;cursor:pointer;transition:background .2s,color .2s;padding:0 2px}
.mt .sp.open{background:var(--hover2);color:inherit}
.mt .mn{background:color-mix(in srgb,var(--accent) 24%,transparent);color:var(--accent-text);border-radius:5px;padding:0 3px;font-weight:600;cursor:pointer}
.mt .cl{background:var(--hover2);border-radius:5px;padding:0 3px;font-weight:600;cursor:pointer}
.msg.me-m{background:color-mix(in srgb,var(--accent) 11%,transparent);box-shadow:inset 3px 0 0 var(--accent)}

  #side{flex:1;width:auto}
  #panel{position:fixed;right:0;top:0;bottom:0;z-index:30;width:min(88vw,320px);display:flex;transform:translateX(104%);transition:transform .35s cubic-bezier(.3,.9,.3,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}

function members(){const s=curServer();if(s)return s.members.map(getUser);if(UI.dm){const d=D.dms.find(x=>x.id===UI.dm);return d?[ACC,getUser(d.uid)]:[ACC]}return[ACC]}

function mentionsMe(t){const a=ACC;return new RegExp('@(todos|everyone|here|'+a.username.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'|'+nameKey(a).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![\\p{L}\\d_])','iu').test(t)}
function md(raw){
  let t=esc(raw);const blocks=[],inl=[];
  t=t.replace(/```(?:[a-z]+\n)?([\s\S]*?)```/g,(_,c)=>{blocks.push(c.replace(/^\n|\n$/g,''));return`\u0000${blocks.length-1}\u0000`});
  t=t.replace(/`([^`\n]+)`/g,(_,c)=>{inl.push(c);return`\u0001${inl.length-1}\u0001`});
  t=t.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  t=t.split('\n').map(l=>/^&gt; /.test(l)?`<span class="bq">${l.slice(5)}</span>`:l).join('\n').replace(/<\/span>\n/g,'</span>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<u>$1</u>').replace(/(^|[^\w*])\*(?!\s)(.+?)\*(?=[^\w*]|$)/g,'$1<i>$2</i>').replace(/(^|[^\w])_(?!\s)(.+?)_(?=[^\w]|$)/g,'$1<i>$2</i>').replace(/~~(.+?)~~/g,'<s>$1</s>').replace(/\|\|(.+?)\|\|/g,'<span class="sp" data-act="spoiler">$1</span>');
  const mem=members();
  t=t.replace(/@([\p{L}\d_.]+)/gu,(m,n)=>{const l=n.toLowerCase();if(['todos','everyone','here'].includes(l))return`<span class="mn">@${n}</span>`;const u=mem.find(u=>(u.username||u.id).toLowerCase()===l||nameKey(u)===l);return u?`<span class="mn" data-act="profile" data-uid="${esc(u.id)}">@${esc(dname(u))}</span>`:m});
  const s=curServer();
  if(s)t=t.replace(/#([a-z0-9-]+)/g,(m,n)=>{const c=s.channels.find(c=>c.name===n&&c.type!=='voice');return c?`<span class="cl" data-act="chan" data-id="${c.id}">#${n}</span>`:m});
  t=t.replace(/:[a-z0-9_]+:/g,m=>SHORT[m]||m);
  t=t.replace(/\u0001(\d+)\u0001/g,(_,i)=>`<code>${inl[i]}</code>`).replace(/\u0000(\d+)\u0000/g,(_,i)=>`<pre>${blocks[i]}</pre>`);
  return t;
}

function switcher(){
  if($('#swi'))return;
  const items=[];
  D.servers.forEach(s=>{items.push({t:s.name,sub:'Servidor',i:'home',f:()=>goServer(s.id)});s.channels.forEach(c=>items.push({t:(c.type==='voice'?'':'#')+c.name,sub:s.name,i:c.type==='voice'?'volume':'hash',f:()=>goServer(s.id,c.id)}))});

  draw();const q=$('#swq',bk);
  const run=i=>{const it=list[i];if(it){bk.remove();it.f()}};
  q.addEventListener('input',()=>{const s=q.value.toLowerCase();list=items.filter(i=>(i.t+' '+i.sub).toLowerCase().includes(s));idx=0;draw()});
  q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,list.length-1);draw()}else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,0);draw()}else if(e.key==='Enter'){e.preventDefault();run(idx)}});
  bk.addEventListener('click',e=>{const r=e.target.closest('[data-i]');if(r)run(+r.dataset.i)});

}

function closeAC(){UI.ac=null;$('#acbox')?.remove()}
function updateAC(){
  const ta=$('#ta');if(!ta)return;const pre=ta.value.slice(0,ta.selectionStart);
  let m=pre.match(/(^|\s)@([\p{L}\d_.]*)$/u),items=[],type='';
  if(m){type='mention';const q=m[2].toLowerCase();items=[...members(),{id:'__all',name:'todos'}].filter(u=>u.id!==ACC.id||0).filter(u=>nameKey(u).includes(q)||(u.username||'').includes(q)).slice(0,6).map(u=>({k:u.id==='__all'?'@todos ':'@'+nameKey(u)+' ',l:dname(u),sub:u.id==='__all'?'Notifica todos':'',u:u.id==='__all'?null:u,start:ta.selectionStart-m[2].length-1}))}
  else if((m=pre.match(/^\/(\w*)$/))){type='cmd';items=CMDS.filter(c=>c[0].slice(1).startsWith(m[1].toLowerCase())).slice(0,7).map(c=>({k:c[0]+' ',l:c[0],sub:c[1],start:0}))}
  if(!items.length){closeAC();return}
  UI.ac={type,items,idx:0,end:ta.selectionStart};drawAC();
}
function drawAC(){
  let b=$('#acbox');if(!b){b=document.createElement('div');b.id='acbox';b.className='auto glass';$('#cmpw').append(b)}
  b.innerHTML=UI.ac.items.map((it,i)=>`<div class="${i===UI.ac.idx?'on':''}" data-act="acpick" data-i="${i}">${it.u?avatar(it.u,24):''}<b>${esc(it.l)}</b><small>${esc(it.sub)}</small></div>`).join('');
}
function applyAC(i){
  const ta=$('#ta'),it=UI.ac.items[i];if(!it)return;
  ta.value=ta.value.slice(0,it.start)+it.k+ta.value.slice(UI.ac.end);const p=it.start+it.k.length;ta.setSelectionRange(p,p);ta.focus();closeAC();autosize(ta);
}

function startTour(){
  $('#layer>.set')?.remove();$$('#layer>.bk:not(#mbk)').forEach(x=>x.remove());closeMenu();
  const hq=D.servers[0];STEPS=hq?STEPS_FULL:STEPS_EMPTY;if(hq&&UI.view!=='server')goServer(hq.id);else if(!hq&&UI.view!=='home')goHome();

  tourStep(0);

function tourStep(i){
  const st=STEPS[i];TOUR.i=i;const mob=isMobile();
  UI.navOpen=!!(st.nav&&mob);syncDrawers();
  setTimeout(()=>{
    if(!TOUR)return;
    const card=$('#tour .tcard'),hole=$('#tour .hole');
    card.innerHTML=`${st.e?`<div class="em">${st.e}</div>`:''}<h3>${esc(st.t)}</h3><p>${bold(st.p)}</p><div class="row"><div class="tdots">${STEPS.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>${i>0?`<button class="btn sm ghost" data-act="tprev">Voltar</button>`:`<button class="btn sm ghost" data-act="tskip">Pular</button>`}<button class="btn sm primary" data-act="tnext">${i===STEPS.length-1?'Começar':'Próximo'}</button></div>`;
    const el=st.sel?$(st.sel):null,r=el&&el.getBoundingClientRect();
    if(el&&r.width>0&&r.height>0){
      hole.classList.remove('none');const pad=6;
      Object.assign(hole.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+pad*2+'px',height:r.height+pad*2+'px'});
      const cw=card.offsetWidth,ch=card.offsetHeight;let x,y;
      if(!mob&&r.right+16+cw<innerWidth){x=r.right+16+pad;y=clamp(r.top,12,innerHeight-ch-12)}
      else if(!mob&&r.left-16-cw>0){x=r.left-16-cw-pad;y=clamp(r.top,12,innerHeight-ch-12)}
      else{x=clamp(r.left,12,innerWidth-cw-12);y=r.bottom+16+ch<innerHeight?r.bottom+16+pad:Math.max(12,r.top-16-ch-pad)}
      card.style.left=x+'px';card.style.top=y+'px';
    }else{
      hole.classList.add('none');hole.style.cssText='';
      card.style.left=Math.max(12,(innerWidth-card.offsetWidth)/2)+'px';card.style.top=Math.max(12,(innerHeight-card.offsetHeight)/2)+'px';
    }
  },st.nav&&mob?380:30);
}
function endTour(done=true){
  if(!TOUR)return;TOUR=null;$('#tour').hidden=true;$('#tour').innerHTML='';UI.navOpen=false;syncDrawers();

  if(kb&&D){let v=kb.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;setSetting(kb.dataset.k,v,true);return}
  const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){f(el,e)}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}});

/* contexto: clique direito e toque longo */
document.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-ctx]');if(!t||!D)return;if(e.target.closest('a,input,textarea'))return;e.preventDefault();openCtx(t,e.clientX,e.clientY)});
let LP=null;
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'||!D)return;const t=e.target.closest('[data-ctx]');if(!t||e.target.closest('button,a,textarea'))return;const x=e.clientX,y=e.clientY;clearTimeout(LP);LP=setTimeout(()=>{LP=null;if(navigator.vibrate)try{navigator.vibrate(12)}catch{}openCtx(t,x,y)},460);t._lp={x,y}});
document.addEventListener('pointermove',e=>{if(LP&&Math.hypot(e.clientX-(e.target.closest('[data-ctx]')?._lp?.x??e.clientX),e.clientY-(e.target.closest('[data-ctx]')?._lp?.y??e.clientY))>10){clearTimeout(LP);LP=null}},{passive:true});
['pointerup','pointercancel','scroll'].forEach(n=>document.addEventListener(n,()=>{clearTimeout(LP);LP=null},{passive:true,capture:true}));

/* teclado */
document.addEventListener('keydown',e=>{
  if(!ACC)return;const mod=e.ctrlKey||e.metaKey,t=e.target;
  if(TOUR){if(e.key==='Escape')endTour(false);else if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();ACT.tnext()}else if(e.key==='ArrowLeft'&&TOUR.i>0)tourStep(TOUR.i-1);return}
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();switcher();return}
  if(mod&&e.key===','){e.preventDefault();openSettings();return}
  if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();stepChan(e.key==='ArrowUp'?-1:1);return}
  if(e.key==='Escape'){
    if($('#ctxmenu')||$('#picker')){closeMenu();return}
    if(UI.edit){UI.edit=null;renderMsgs(false);$('#ta')?.focus();return}
    if(UI.ac){closeAC();return}
    if(closeTop())return;
    if(UI.reply){UI.reply=null;renderComposer(true);return}
    if(isMobile()&&(UI.navOpen||UI.panelOpen)){UI.navOpen=false;UI.panelOpen=false;syncDrawers();return}
    return;
  }
  if(t.id==='ta'){
    if(UI.ac){
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=UI.ac.items.length;UI.ac.idx=(UI.ac.idx+(e.key==='ArrowDown'?1:-1)+n)%n;drawAC();return}
      if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();applyAC(UI.ac.idx);return}
    }
    if(e.key==='Enter'&&!e.shiftKey&&!isTouch()&&!e.isComposing){e.preventDefault();sendMsg();return}
    if(e.key==='ArrowUp'&&!t.value){const l=[...(D.msgs[curKey()]||[])].reverse().find(m=>m.uid===ACC.id&&m.text&&!m.note);if(l){e.preventDefault();UI.edit=l.id;renderMsgs(false)}}
  }
  if(t.id==='edta'){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const m=(D.msgs[curKey()]||[]).find(x=>x.id===UI.edit);const v=t.value.trim();if(m&&v&&v!==m.text){m.text=v;m.edited=true;save()}else if(!v&&m){D.msgs[curKey()]=D.msgs[curKey()].filter(x=>x.id!==m.id)}UI.edit=null;renderMsgs(false);$('#ta')?.focus()}
  }
  if(t.id==='fadd'&&e.key==='Enter')ACT.fadd();
});

/* anexos: colar e arrastar */
document.addEventListener('paste',e=>{if(e.target.id!=='ta')return;const f=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(f.length){e.preventDefault();addImages(f)}});
['dragenter','dragover'].forEach(n=>document.addEventListener(n,e=>{if(!$('#drop')||!e.dataTransfer?.types?.includes('Files'))return;e.preventDefault();$('#drop').classList.add('show')}));
['dragleave','drop'].forEach(n=>document.addEventListener(n,e=>{if(n==='dragleave'&&e.relatedTarget)return;$('#drop')?.classList.remove('show');if(n==='drop'&&$('#drop')){e.preventDefault();addImages([...e.dataTransfer.files])}}));

/* gestos no celular */
let TX=null;
document.addEventListener('touchstart',e=>{TX={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',e=>{
  if(!TX||!ACC||!isMobile()||TOUR)return;const dx=e.changedTouches[0].clientX-TX.x,dy=e.changedTouches[0].clientY-TX.y;const sx=TX.x;TX=null;
  if(Math.abs(dx)<70||Math.abs(dy)>60||$('#layer .bk,#layer .set'))return;
  if(dx>0){if(UI.panelOpen&&sx>innerWidth*.3){UI.panelOpen=false;syncDrawers();renderHead()}else if(!UI.navOpen&&(sx<36||UI.view!=='home')){UI.navOpen=true;syncDrawers()}}
  else{if(UI.navOpen){UI.navOpen=false;syncDrawers()}else if(!UI.panelOpen&&sx>innerWidth-40&&(UI.view!=='home'||UI.dm)){UI.panelOpen=true;syncDrawers();renderPanel();renderHead()}}
},{passive:true});
/* gestos nas mensagens: arrastar para a esquerda responde; arrastar e segurar edita (ajustável no painel) */
const gestCfg=()=>{const g=(REMOTE&&REMOTE.gestures)||{};return{reply:g.reply!==false,edit:g.edit!==false,hold:Math.min(3000,Math.max(300,Number(g.hold)||1000))}};
let MG=null;
const vibe=()=>{if(navigator.vibrate)try{navigator.vibrate(12)}catch{}};
document.addEventListener('touchstart',e=>{
  const m=e.target.closest&&e.target.closest('.msg[data-mid]');
  if(!m||!ACC||!D||e.target.closest('button,a,textarea,input,img,.ib')){MG=null;return}
  const t=e.touches[0];MG={el:m,mid:m.dataset.mid,x:t.clientX,y:t.clientY,dx:0,on:false,timer:0,done:false};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!MG||MG.done)return;const t=e.touches[0],dx=t.clientX-MG.x,dy=t.clientY-MG.y;if(dx<0&&Math.abs(dy)<=30)MG.el.style.transform='translateX('+Math.max(dx,-90)+'px)';
  if(!MG.on){if(Math.abs(dy)>30){MG=null;return}if(dx<-60){MG.on=true;MG.el.style.opacity='.7';const c=gestCfg();
    if(c.edit)MG.timer=setTimeout(()=>{if(!MG)return;MG.done=true;MG.el.style.opacity='';vibe();editMsg(MG.mid)},c.hold)}}
  else if(dx>-30){clearTimeout(MG.timer);MG.el.style.opacity='';MG.on=false;MG.dx=0;return}
  if(MG.on)MG.dx=dx;
},{passive:true});
document.addEventListener('touchend',()=>{
  if(!MG)return;const g=MG;MG=null;clearTimeout(g.timer);g.el.style.opacity='';resetDrag(g.el);
  if(!g.on||g.done||g.dx>-60)return;
  if(gestCfg().reply)replyMsg(g.mid);
},{passive:true});
document.addEventListener('touchcancel',()=>{if(MG){clearTimeout(MG.timer);MG.el.style.opacity='';resetDrag(MG.el)}MG=null},{passive:true});
function resetDrag(el){el.style.transition='transform .18s ease';el.style.transform='';setTimeout(()=>{el.style.transition=''},200)}
function replyMsg(mid){const m=(D.msgs[curKey()]||[]).find(x=>x.id===mid);if(m){vibe();setReply(m)}}
function editMsg(mid){const m=(D.msgs[curKey()]||[]).find(x=>x.id===mid);if(m&&m.uid===ACC.id&&!m.note&&m.text){UI.edit=mid;renderMsgs(false)}}
matchMedia('(max-width:860px)').addEventListener?.('change',()=>{if(!ACC)return;UI.navOpen=false;UI.panelOpen=!isMobile();syncDrawers();renderHead();applySettings()});

/* ================= login ================= */
const normName=t=>String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const reservedName=t=>RESERVED.includes(normName(t));
const userTaken=t=>ACCS.some(a=>!a.guest&&(!ACC||a.id!==ACC.id)&&normName(a.username)===normName(t));
const displayBad=t=>reservedName(t)||userTaken(t);
const checkNew=(u,p)=>!/^[a-z0-9_.]{3,20}$/.test(u)?'Use de 3 a 20 letras minúsculas, números, ponto ou _.':reservedName(u)?'Esse nome é reservado. Escolha outro.':userTaken(u)?'Esse nome já está em uso ou é parecido demais com outro.':p.length<6?'A senha precisa ter 6 caracteres ou mais.':'';
async function hash(pw,salt){try{const b=new TextEncoder().encode(salt+':'+pw);const d=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let h=5381;const s=salt+pw;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return'x'+h}}
let SIGNUP_IMG='';

  const L=LAST,known=ACCS.filter(a=>!a.guest);
  el.innerHTML=`<div class="lg"><div class="lg-hero">${LOGO}<h1>Blondu</h1><p>Seu cantinho de conversa. Servidores, amigos e voz em qualquer tela.</p><ul class="lg-feat"><li>${ic('drop')}Liquid Glass, Blur ou Modo leve</li><li>${ic('monitor')}Celular e computador, sem instalar nada</li><li>${ic('palette')}Temas, cores e fundos do seu jeito</li></ul></div>
  <div class="lg-card glass"><h2>${tab==='in'?'Que bom te ver':'Crie sua conta'}</h2><div class="mut">${tab==='in'?'Entre para continuar suas conversas.':'Leva menos de um minuto.'}</div>
  <div class="lg-tabs" role="tablist"><button class="${tab==='in'?'on':''}" data-lt="in" role="tab">Entrar</button><button class="${tab==='up'?'on':''}" data-lt="up" role="tab">Criar conta</button></div>
  <form id="lgf" novalidate>${tab==='up'?`<div class="row" style="margin-bottom:14px"><span id="lg-av">${avatar({img:SIGNUP_IMG,emoji:'🙂',color:'#6b7280'},56)}</span><div><button type="button" class="btn sm" data-lt="photo">${ic('image',16)} Escolher foto</button><div class="faint" style="font-size:13px;margin-top:4px">Opcional. Você pode trocar depois.</div></div></div><div class="fld"><label class="lbl" for="lg-dn">NOME DE EXIBIÇÃO</label><input class="in" id="lg-dn" maxlength="24" autocomplete="nickname" placeholder="Como quer ser chamado(a)?"></div>`:''}
  ${SB?(tab==='in'?`<div class="fld"><label class="lbl" for="lg-user">E-MAIL</label><input class="in" type="email" id="lg-user" autocomplete="email" autocapitalize="none" spellcheck="false"></div>`:`<div class="fld"><label class="lbl" for="lg-user">NOME DE USUÁRIO</label><input class="in" id="lg-user" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false"></div><div class="fld"><label class="lbl" for="lg-mail">E-MAIL</label><input class="in" type="email" id="lg-mail" autocomplete="email" autocapitalize="none" spellcheck="false"></div>`):`<div class="fld"><label class="lbl" for="lg-user">NOME DE USUÁRIO</label><input class="in" id="lg-user" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" ${known[0]&&tab==='in'?`value="${esc(known[0].username)}"`:''}></div>`}
  <div class="fld"><label class="lbl" for="lg-pass">SENHA</label><input class="in" type="password" id="lg-pass" autocomplete="${tab==='in'?'current-password':'new-password'}"></div>
  ${tab==='in'?`<label class="chk"><input type="checkbox" id="lg-rem" checked> Manter conectado neste aparelho</label>`:`<div class="fld"><label class="lbl" for="lg-p2">CONFIRMAR SENHA</label><input class="in" type="password" id="lg-p2" autocomplete="new-password"></div>`}
  <button class="btn primary" style="width:100%" type="submit" id="lg-go">${tab==='in'?'Entrar':'Criar conta e começar'}</button><p class="err" id="lg-err" role="alert"></p></form>
  <div class="or">ou</div><button class="btn ghost" style="width:100%" data-lt="guest">Entrar como convidado</button>
  <div class="lg-style"><span>Visual:</span>${[['glass','Liquid Glass'],['blur','Blur'],['default','Padrão'],['lite','Leve'],['discord','Discord'],['anim','Animação']].map(([v,l])=>`<button data-ls="${v}" class="${L.style===v?'on':''}">${l}</button>`).join('')}<button data-lth="${L.theme==='light'?'dark':'light'}">${L.theme==='light'?'Escuro':'Claro'}</button></div></div></div>`;

document.addEventListener('click',e=>{
  const lt=e.target.closest('[data-lt]'),ls=e.target.closest('[data-ls]'),lth=e.target.closest('[data-lth]');
  if(lt){if(lt.dataset.lt==='photo')pickFile('image/*',async f=>{try{SIGNUP_IMG=await imgData(f,256,.85,true);const a=$('#lg-av');if(a)a.innerHTML=avatar({img:SIGNUP_IMG,emoji:'🙂',color:'#6b7280'},56)}catch{toast('Imagem inválida')}});else lt.dataset.lt==='guest'?guest():showLogin(lt.dataset.lt)}

  if(lth){LAST.theme=lth.dataset.lth;LS.set('bl.last',LAST);setTheme(()=>{});showLogin(document.querySelector('[data-lt].on')?.dataset.lt||'in')}

const lerr=m=>{const e=$('#lg-err');if(e)e.textContent=m};
async function submitLogin(){
  if(SB){
    const em=val('#lg-user').trim(),p=$('#lg-pass').value;if(!em||!p)return lerr('Digite e-mail e senha.');
    lerr('Entrando…');
    const {data,error}=await SB.auth.signInWithPassword({email:em,password:p});
    if(error)return lerr(/confirm/i.test(error.message)?'Confirme seu e-mail pelo link que enviamos antes de entrar.':'E-mail ou senha incorretos.');
    const acc=await sbLoadAcc(data.user);if(!acc)return lerr('Esta conta não tem perfil. Fale com o administrador.');
    LS.set('bl.session',acc.id);enter(acc);return;
  }
  const u=val('#lg-user').toLowerCase(),p=$('#lg-pass').value;if(!u||!p)return lerr('Digite usuário e senha.');
  const a=ACCS.find(x=>x.username===u&&!x.guest);if(!a||a.hash!==await hash(p,a.salt))return lerr('Usuário ou senha incorretos.');
  LS.set('bl.session',$('#lg-rem').checked?a.id:null);enter(a);
}
async function submitSignup(){
  if(SB){
    const u=val('#lg-user').toLowerCase(),em=val('#lg-mail').trim(),p=$('#lg-pass').value,dn=val('#lg-dn')||u;
    const e=checkNew(u,p)||(!/^\S+@\S+\.\S+$/.test(em)?'Digite um e-mail válido.':'')||(p!==$('#lg-p2').value?'As senhas não são iguais.':'')||(displayBad(dn)?'Esse nome de exibição é reservado ou pertence a outra pessoa.':'');
    if(e)return lerr(e);
    lerr('Criando conta…');
    if(!(await sbNameFree(u)))return lerr('Esse nome de usuário já está em uso.');
    const {data,error}=await SB.auth.signUp({email:em,password:p,options:{data:{username:u,display:dn,img:SIGNUP_IMG,color:pick(COLORS)}}});
    if(error)return lerr(/registered|already/i.test(error.message)?'Esse e-mail já tem conta. Tente entrar.':/password/i.test(error.message)?'A senha precisa ter pelo menos 6 caracteres.':error.message);
    SIGNUP_IMG='';
    if(data.session){const acc=await sbLoadAcc(data.user);if(acc){LS.set('bl.session',acc.id);enter(acc,true);return}}
    showLogin('in');
    const er=$('#lg-err');if(er)er.textContent='Enviamos um link para o seu e-mail. Confirme e depois entre aqui.';
    return;
  }
  const u=val('#lg-user').toLowerCase(),p=$('#lg-pass').value,dn=val('#lg-dn')||u;
  const e=checkNew(u,p)||(displayBad(dn)?'Esse nome de exibição é reservado ou pertence a outra pessoa.':'')||(p!==$('#lg-p2').value?'As senhas não são iguais.':'');if(e)return lerr(e);
  const salt=rid(),col=pick(COLORS);
  const a={id:rid(),username:u,display:dn,salt,hash:await hash(p,salt),color:col,emoji:pick(EMOJI_ICONS),img:SIGNUP_IMG,banner:col,bio:'',status:'online',custom:'',created:Date.now(),guest:false};SIGNUP_IMG='';
  ACCS.push(a);LS.set('bl.accs',ACCS);LS.set('bl.session',a.id);enter(a,true);
}
function guest(){
  const col=pick(COLORS),n=Math.floor(1000+Math.random()*9000);
  enter({id:'g'+rid(),username:'convidado'+n,display:'Convidado',salt:'',hash:'',color:col,emoji:pick(EMOJI_ICONS),img:'',banner:col,bio:'',status:'online',custom:'',created:Date.now(),guest:true},true);
}

/* ================= entrar / sair ================= */
function enter(acc,isNew){
  ACC=acc;let d=acc.guest?null:LS.get('bl.d.'+acc.id,null);
  if(!d){d=seed(acc);d.settings=merge(defaults(),JSON.parse(JSON.stringify(LAST)));if(REMOTE?.defaults&&!LS.get('bl.last',null)){const df=REMOTE.defaults,pr=PRESET[df.style];if(pr)Object.assign(d.settings,JSON.parse(JSON.stringify(pr)));for(const k of ['theme','style','accent','wall','blur','alpha','sat','radius'])if(df[k]!==undefined)d.settings[k]=df[k]}}
  else if(d.v!==2){const st=d.settings,td=d.tutorialDone;d=seed(acc);d.settings=merge(defaults(),st);d.tutorialDone=!!td}
  else d.settings=merge(defaults(),d.settings);
  if(isNew&&!acc.guest&&!(REMOTE&&REMOTE.defaults)){d.settings.style='lite';Object.assign(d.settings,JSON.parse(JSON.stringify(PRESET.lite)));d.settings.style='lite'}
  D=d;Object.assign(UI,{view:'home',sid:null,cid:null,dm:null,tab:'all',panel:'members',reply:null,edit:null,pend:[],typing:{},voice:null,q:'',navOpen:false,panelOpen:!isMobile(),mute:false,deaf:false});
  const ua=navigator.userAgent;D.sessions=[{t:Date.now(),d:(/Mobile|Android|iPhone/.test(ua)?'Celular':'Computador')+' · '+(/Edg\//.test(ua)?'Edge':/Chrome\//.test(ua)?'Chrome':/Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'Navegador')},...(D.sessions||[])].slice(0,6);
  applySettings();$('#login').hidden=true;$('#login').innerHTML='';$('#app').hidden=false;
  const s=D.servers[0];if(s)go('server',{sid:s.id,cid:ch(s,'geral')?.id});else go('home');
  save(true);applyRemote();if(SB&&!acc.guest)sbFriendsLoad();if(onl()){sbDmsLoad();sbRealtime();sbCallSetup()}
  if(!D.tutorialDone)wait(startTour,1000);else if(isNew)toast('Bem-vindo(a), '+dname(ACC)+'!');
}
function logout(){
  if(SB)SB.auth.signOut().catch(()=>{});
  if(ACC&&D)save(true);T.forEach(clearTimeout);T.length=0;INT.forEach(clearInterval);INT.length=0;endTour(false);

/* ================= administração e configuração remota ================= */
/* O administrador edita um arquivo config.json no GitHub. Todo aparelho que abre o app lê esse arquivo
   e aplica avisos, manutenção, aviso de nova versão, aparência padrão e temas novos. */
const isAdmin=()=>!!ACC&&!ACC.guest&&(SB?!!ACC.isAdm:ADMIN_USERS.includes(normName(ACC.username)));
const cmpVer=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1}return 0};
const okLink=u=>/^https?:\/\//i.test(u||'');
let REMOTE=LS.get('bl.remote',null)||{};
const ADM_DEF=()=>({v:1,notice:{id:'',text:'',level:'info',link:''},maintenance:{on:false,text:'Estamos fazendo melhorias. Voltamos já.'},update:{version:'',text:'',url:''},defaults:null,themes:[],flags:{images:true},gestures:{reply:true,edit:true,hold:1000}});
let ADM=merge(ADM_DEF(),LS.get('bl.adm',null));
const admSave=()=>{LS.set('bl.adm',ADM);const j=$('#admjson');if(j)j.value=JSON.stringify(admConfig(),null,2)};
function admConfig(){
  const c=JSON.parse(JSON.stringify(ADM));
  if(!c.notice.text)c.notice=null;
  if(!c.maintenance.on)c.maintenance=null;
  if(!c.update.version)c.update=null;
  if(!c.defaults)delete c.defaults;
  if(!c.themes.length)delete c.themes;
  c.gestures={reply:ADM.gestures?.reply!==false,edit:ADM.gestures?.edit!==false,hold:Number(ADM.gestures?.hold)||1000};
  return c;
}
async function loadRemote(){
  if(SB){const c=await sbLoadConfig();if(c){REMOTE=c;LS.set('bl.remote',c)}applyRemote();return}
  if(REMOTE_URL){
    try{const ct=new AbortController(),t=setTimeout(()=>ct.abort(),6000);
      const r=await fetch(REMOTE_URL+(REMOTE_URL.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store',signal:ct.signal});clearTimeout(t);
      if(!r.ok)throw 0;const j=await r.json();if(j&&typeof j==='object'){REMOTE=j;LS.set('bl.remote',j)}}catch{}
  }
  applyRemote();
}
function applyRemote(){
  const R=REMOTE||{},nb=$('#notice');let mt=$('#maint');
  if(R.maintenance&&R.maintenance.on&&ACC&&!isAdmin()){
    if(!mt){mt=document.createElement('div');mt.id='maint';mt.className='bk';mt.style.zIndex=95;document.body.append(mt)}
    mt.innerHTML=`<div class="modal glass" style="text-align:center;padding:30px 24px;align-items:center"><div style="font-size:46px">🛠️</div><h3 style="font:800 24px var(--disp);margin:6px 0">Em manutenção</h3><p class="mut" style="margin:0">${esc(R.maintenance.text||'Voltamos em breve.')}</p></div>`;
  }else if(mt)mt.remove();
  let b=null;
  if(R.update&&R.update.version&&cmpVer(R.update.version,APP_VERSION)>0)b={id:'upd'+R.update.version,text:R.update.text||'Há uma nova versão do Blondu.',level:'warn',link:R.update.url,label:'Atualizar'};

const PROF={};
function cacheProf(p){if(p&&p.id)PROF[p.id]={id:p.id,username:p.username,display:p.display||p.username,img:p.img||'',color:p.color||'#6b7280',emoji:'🙂',banner:p.color||'#6b7280',bio:p.bio||'',status:'offline',custom:'',guest:false,online:true}}
async function sbFriendsLoad(){
  if(!SB||!ACC||ACC.guest)return;
  try{
    const {data,error}=await SB.from('friendships').select('id,requester,addressee,status');
    if(error||!data)return;
    const ids=[...new Set(data.flatMap(r=>[r.requester,r.addressee]).filter(x=>x!==ACC.id))];
    const falta=ids.filter(i=>!PROF[i]);
    if(falta.length){const {data:ps}=await SB.from('profiles').select('*').in('id',falta);(ps||[]).forEach(cacheProf)}
    D.friends=data.map(r=>{const outro=r.requester===ACC.id?r.addressee:r.requester;return{id:outro,s:r.status==='accepted'?'friend':r.requester===ACC.id?'out':'in',fid:r.id}}).filter(f=>PROF[f.id]);
    save();renderFriends();renderSide();renderHead();
  }catch{}
}
async function addFriendOnline(raw){
  const n=String(raw||'').toLowerCase().replace(/^@/,'').trim();
  if(!n)return'Digite um nome de usuário.';
  if(n===ACC.username)return'Você não pode adicionar a si mesmo.';
  const {data:p,error}=await SB.from('profiles').select('*').eq('username',n).maybeSingle();
  if(error)return'Não consegui falar com o servidor. Tente de novo.';
  if(!p)return`Não encontramos ninguém com o nome “${n}”.`;
  cacheProf(p);
  const f=D.friends.find(x=>x.id===p.id);
  if(f)return f.s==='friend'?'Vocês já são amigos.':'Já existe um pedido com essa pessoa.';
  const {error:e2}=await SB.from('friendships').insert({requester:ACC.id,addressee:p.id});
  if(e2)return/duplicate|unique/i.test(e2.message)?'Já existe um pedido com essa pessoa.':'Não deu para enviar o pedido.';
  await sbFriendsLoad();return'';
}

async function sbRemoveFriend(f){const {error}=await SB.from('friendships').delete().eq('id',f.fid);if(!error)await sbFriendsLoad();return!error}

async function sbOnGroup(r){
  try{
    if(r.autor===ACC.id)return;
    const key='g:'+r.grupo_id;
    if(!PROF[key]){const {data:g}=await SB.from('grupos').select('id,nome').eq('id',r.grupo_id).maybeSingle();if(!g)return;gAddDm(g.id,g.nome)}
    if(!D.dms.some(d=>d.id===key))gAddDm(r.grupo_id);
    if(!PROF[r.autor]){const {data:p}=await SB.from('profiles').select('*').eq('id',r.autor).maybeSingle();if(p)cacheProf(p)}
    const m={id:'gm'+r.id,uid:r.autor,t:Date.parse(r.criado_em)||Date.now(),text:r.corpo,audio:r.audio||null};
    if((D.msgs[key]||[]).some(x=>x.id===m.id))return;

  const bk=modal({title:'Novo grupo',body:`<div class="fld"><label class="lbl" for="gnome">NOME DO GRUPO</label><input class="in" id="gnome" maxlength="40" placeholder="Ex: Turma do jogo"></div><label class="lbl">AMIGOS (ATÉ 14)</label><div id="gl" style="max-height:44vh;overflow:auto">${fr.map(f=>{const u=getUser(f.id);return`<label class="frow" style="cursor:pointer"><input type="checkbox" value="${esc(f.id)}" aria-label="${esc(dname(u))}"> ${avatar(u,34)}<div class="grow"><b>${esc(dname(u))}</b></div></label>`}).join('')}</div><p class="err" id="gerr"></p>`,actions:[{l:'Cancelar',cls:'ghost'},{l:'Criar grupo',cls:'primary',f:()=>{sbCreateGroup(bk);return false}}]});

async function sbCreateGroup(bk){
  const nome=val('#gnome').trim();const sel=[...bk.querySelectorAll('#gl input:checked')].map(i=>i.value);
  const err=(m)=>{$('#gerr').textContent=m};
  if(!nome)return err('Dê um nome ao grupo.');
  if(!sel.length)return err('Escolha pelo menos uma pessoa.');
  if(sel.length>14)return err('Um grupo pode ter até 15 pessoas (você + 14).');
  const {data:g,error}=await SB.from('grupos').insert({nome,dono:ACC.id}).select().single();
  if(error||!g)return err('Não deu para criar o grupo.');
  const {error:e2}=await SB.from('grupo_membros').insert([ACC.id,...sel].map(u=>({grupo_id:g.id,usuario:u})));
  if(e2)return err('Não deu para adicionar as pessoas. Confira se são suas amigas.');

}

  const key=curKey();if(UI.view!=='home'||!key||!D.dms.some(d=>d.id===key)){toast('Abra uma conversa para gravar');return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch{toast('Permita o uso do microfone');return}
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  const mr=new MediaRecorder(stream,mime?{mimeType:mime}:{});const chunks=[];const t0=Date.now();
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());REC=null;updRec();
    const type=mr.mimeType||'audio/webm';const blob=new Blob(chunks,{type});
    if(Date.now()-t0<700){toast('Áudio muito curto');return}
    await sbSendAudio(key,blob,type,Date.now()-t0)};
  mr.start();REC={mr};updRec();
  setTimeout(()=>{if(REC&&REC.mr===mr)mr.stop()},60000);
  toast('Gravando… toque de novo para enviar');
}
async function sbSendAudio(key,blob,type,ms){
  const ext=type.includes('mp4')?'m4a':'webm';const path=`${ACC.id}/${Date.now()}.${ext}`;
  const {error:e1}=await SB.storage.from('audios').upload(path,blob,{contentType:type,upsert:false});
  if(e1){toast('Não deu para enviar o áudio');return}
  const url=SB.storage.from('audios').getPublicUrl(path).data.publicUrl;
  const m={id:rid(),uid:ACC.id,t:Date.now(),text:'🎤 Áudio',audio:url};
  addMsg(key,m);UI.fresh.add(m.id);renderMsgs(true);SND.send();
  const row=String(key).startsWith('g:')
    ?SB.from('grupo_mensagens').insert({grupo_id:key.slice(2),autor:ACC.id,corpo:'🎤 Áudio',audio:url})
    :SB.from('dm_messages').insert({sender:ACC.id,recipient:key,body:'🎤 Áudio',audio:url});
  const {error}=await row;if(error)toast('Áudio não foi enviado. Verifique a conexão.');
}
Object.assign(ACT,{rec:()=>recToggle()});

/* ----- chamada de voz entre duas pessoas (WebRTC; sinalização pelo Supabase) ----- */
const RTC_CFG={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
let CALL=null,CALL_IN=null,CALL_Q=[],SB_CALL_ID=null;
const OUTCH={};
function sigTo(uid,payload){
  let c=OUTCH[uid];
  if(!c){c=OUTCH[uid]={ready:false,q:[]};c.ch=SB.channel('call-'+uid);c.ch.subscribe(st=>{if(st==='SUBSCRIBED'){c.ready=true;c.q.splice(0).forEach(p=>c.ch.send({type:'broadcast',event:'sig',payload:p}))}})}
  const full=Object.assign({},payload,{from:ACC.id,name:dname(ACC)});
  if(c.ready)c.ch.send({type:'broadcast',event:'sig',payload:full});else c.q.push(full);
}
function sbCallSetup(){
  if(!onl()||SB_CALL_ID===ACC.id)return;SB_CALL_ID=ACC.id;
  try{SB.channel('call-'+ACC.id).on('broadcast',{event:'sig'},({payload})=>onSig(payload)).subscribe()}catch{}
}
function addIce(c){
  if(CALL&&CALL.pc&&CALL.pc.remoteDescription){CALL.pc.addIceCandidate(c).catch(()=>{})}else CALL_Q.push(c);
}
function callBar(){
  let b=$('#callbar');
  if(!CALL){b&&b.remove();return}
  if(!b){b=document.createElement('div');b.id='callbar';b.className='glass';document.body.append(b)}
  b.innerHTML=`<span class="ell">${CALL.ativa?'Em chamada com':'Chamando'} <b>${esc(dname(getUser(CALL.peer)))}</b></span><button class="btn sm" data-act="callmute">${CALL.muted?'Ativar mic':'Silenciar'}</button><button class="btn sm bad" data-act="callend">Desligar</button>`;
}
function callPeer(pc,peer){
  pc.onicecandidate=e=>{if(e.candidate)sigTo(peer,{t:'ice',c:e.candidate.toJSON()})};
  pc.ontrack=e=>{if(!CALL)return;const a=document.createElement('audio');a.autoplay=true;a.srcObject=e.streams[0];document.body.append(a);CALL.audio=a};
  pc.onconnectionstatechange=()=>{
    if(!CALL)return;
    if(pc.connectionState==='connected'){CALL.ativa=true;callBar();SND.join()}
    if(['failed','closed'].includes(pc.connectionState))callEnd(false,'A ligação caiu.');
  };
}
async function getMic(){return navigator.mediaDevices.getUserMedia({audio:true,video:false})}
async function callStart(uid){
  if(CALL){toast('Você já está em uma chamada');return}
  if(!navigator.mediaDevices){toast('Este aparelho não consegue usar o microfone');return}
  let stream;try{stream=await getMic()}catch{toast('Permita o uso do microfone para ligar');return}
  const pc=new RTCPeerConnection(RTC_CFG);CALL={peer:uid,pc,stream,ativa:false,muted:false};
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  callPeer(pc,uid);callBar();
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  sigTo(uid,{t:'offer',sdp:pc.localDescription.toJSON()});
}
function callEnd(send,msg){
  if(!CALL&&!CALL_IN)return;
  if(CALL){const c=CALL;CALL=null;if(send)sigTo(c.peer,{t:'bye'});try{c.pc.close()}catch{}c.stream.getTracks().forEach(t=>t.stop());c.audio&&c.audio.remove()}
  CALL_IN=null;CALL_Q=[];callBar();
  if(msg)toast(msg);
}
async function callAccept(){
  const ci=CALL_IN;if(!ci)return;CALL_IN=null;
  let stream;try{stream=await getMic()}catch{sigTo(ci.from,{t:'deny'});toast('Sem microfone para atender');return}
  const pc=new RTCPeerConnection(RTC_CFG);CALL={peer:ci.from,pc,stream,ativa:false,muted:false};
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  callPeer(pc,ci.from);
  try{
    await pc.setRemoteDescription(new RTCSessionDescription(ci.sdp));
    const q=CALL_Q.splice(0);for(const c of q)await pc.addIceCandidate(c).catch(()=>{});
    const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
    sigTo(ci.from,{t:'answer',sdp:pc.localDescription.toJSON()});
    callBar();
  }catch{callEnd(true,'Não foi possível atender.')}
}
function callDeny(){const ci=CALL_IN;CALL_IN=null;if(ci)sigTo(ci.from,{t:'deny'})}
async function onSig(p){
  if(!p||!ACC)return;
  if(!PROF[p.from]&&p.name)PROF[p.from]={id:p.from,username:'',display:p.name,img:'',color:'#6b7280',emoji:'🙂',banner:'#6b7280',bio:'',status:'online',custom:'',guest:false,online:true};
  if(p.t==='offer'){
    if(CALL||CALL_IN){sigTo(p.from,{t:'deny'});return}
    CALL_IN={from:p.from,sdp:p.sdp};CALL_Q=[];
    SND.ment();
    modal({title:'Chamada de voz',body:`<b>${esc(p.name||'Alguém')}</b> está ligando para você`,actions:[{l:'Recusar',cls:'ghost',f:()=>callDeny()},{l:'Atender',cls:'primary',f:()=>{callAccept()}}]});
    return;
  }
  if(p.t==='answer'&&CALL&&CALL.peer===p.from){
    await CALL.pc.setRemoteDescription(new RTCSessionDescription(p.sdp)).catch(()=>{});
    const q=CALL_Q.splice(0);for(const c of q)CALL.pc.addIceCandidate(c).catch(()=>{});
    return;
  }
  if(p.t==='ice'&&(CALL&&CALL.peer===p.from||!CALL)){addIce(p.c);return}
  if(p.t==='deny'&&CALL&&CALL.peer===p.from){callEnd(false,'Chamada recusada.');return}
  if(p.t==='bye'&&CALL&&CALL.peer===p.from){callEnd(false,'Chamada encerrada.');return}
  if(p.t==='bye'&&CALL_IN&&CALL_IN.from===p.from){CALL_IN=null;$('#layer>.bk:not(#mbk)')?.remove();toast('Ligação cancelada.')}
}
Object.assign(ACT,{
  call:()=>{const d=D.dms.find(x=>x.id===UI.dm);if(d&&onl())callStart(d.uid)},
  callend:()=>callEnd(true,'Chamada encerrada.'),
  callmute:()=>{if(!CALL)return;CALL.muted=!CALL.muted;CALL.stream.getAudioTracks().forEach(t=>t.enabled=!CALL.muted);callBar()}
});

(async function boot(){
  ACCS=LS.get('bl.accs',[]);if(!Array.isArray(ACCS))ACCS=[];
  LAST=merge(defaults(),LS.get('bl.last',null));if(lowEnd()&&!LS.get('bl.last',null))Object.assign(LAST,{style:'lite'},PRESET.lite);
  applySettings();
  if(SB){
    let acc=null;try{const {data}=await SB.auth.getSession();if(data&&data.session)acc=await sbLoadAcc(data.session.user)}catch{}
    if(acc){LS.set('bl.session',acc.id);enter(acc)}else showLogin('in');
    loadRemote();return;
  }
  const sid=LS.get('bl.session',null),a=sid&&ACCS.find(x=>x.id===sid);
  if(a)enter(a);else showLogin(ACCS.length?'in':'up');
  loadRemote();
})();
})();

    if(document.querySelector('#layer>.bk,#layer>.set,#ctxmenu,#picker'))return true;

  }
  A.addListener('backButton',function(){
    if(aberto())document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
    else if(A.minimizeApp)A.minimizeApp();
  });

name: Gerar APK do Blondu

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícones e tela de abertura
        run: npx capacitor-assets generate --android --iconBackgroundColor '#f2b441' --splashBackgroundColor '#0f0d17'

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Blondu-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
